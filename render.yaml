services:
  - type: web
    name: chainsight
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # you will paste this in Render dashboard
      - key: DEEPSEEK_API_KEY
        sync: false          # you will paste this in Render dashboard
      - key: PYTHON_VERSION
        value: "3.11"
